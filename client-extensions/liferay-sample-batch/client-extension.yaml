assemble:
    -   from: batch
        into: batch
liferay-batch:
    name: Liferay Batch
    oAuthApplicationHeadlessServer: liferay-batch-oauth-application-headless-server
    type: batch
liferay-batch-oauth-application-headless-server:
    .serviceAddress: localhost:8080
    .serviceScheme: http
    name: Liferay OAuth Application Headless Server
    scopes:
        -   Liferay.Headless.Admin.Workflow.everything
        -   Liferay.Headless.Batch.Engine.everything
        -   Liferay.Object.Admin.REST.everything
    type: oAuthApplicationHeadlessServer